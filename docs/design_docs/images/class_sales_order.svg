<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="500" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#333">销售管理模块类图 - 订单与详情 (Class Diagram: Sales Order &amp; Detail)</text>

  <!-- Order Class -->
  <rect x="50" y="80" width="280" height="260" fill="#e6f7ff" stroke="#1890ff" stroke-width="2"/>
  <path d="M 50 110 L 330 110" stroke="#1890ff" stroke-width="2"/>
  <text x="190" y="102" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Order (销售订单)</text>
  <text x="60" y="130" font-family="Arial" font-size="11">- id: Integer {PK}</text>
  <text x="60" y="145" font-family="Arial" font-size="11">- order_no: String (唯一单号)</text>
  <text x="60" y="160" font-family="Arial" font-size="11">- customer_id: Integer {FK}</text>
  <text x="60" y="175" font-family="Arial" font-size="11">- total_amount: Float</text>
  <text x="60" y="190" font-family="Arial" font-size="11">- status: Enum (PENDING/PAID/SHIPPED)</text>
  <text x="60" y="205" font-family="Arial" font-size="11">- created_at: DateTime</text>
  <path d="M 50 220 L 330 220" stroke="#1890ff" stroke-width="1"/>
  <text x="60" y="240" font-family="Arial" font-size="11">+ calculate_total(): float</text>
  <text x="60" y="255" font-family="Arial" font-size="11">+ update_status(status): void</text>

  <!-- OrderDetail Class -->
  <rect x="450" y="80" width="250" height="200" fill="#e6f7ff" stroke="#1890ff" stroke-width="2"/>
  <path d="M 450 110 L 700 110" stroke="#1890ff" stroke-width="2"/>
  <text x="575" y="102" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">OrderDetail (订单明细)</text>
  <text x="460" y="130" font-family="Arial" font-size="11">- id: Integer {PK}</text>
  <text x="460" y="145" font-family="Arial" font-size="11">- order_id: Integer {FK}</text>
  <text x="460" y="160" font-family="Arial" font-size="11">- part_id: Integer {FK}</text>
  <text x="460" y="175" font-family="Arial" font-size="11">- quantity: Integer</text>
  <text x="460" y="190" font-family="Arial" font-size="11">- unit_price: Float</text>
  <text x="460" y="205" font-family="Arial" font-size="11">- subtotal: Float</text>

  <!-- Relationships -->
  <line x1="330" y1="150" x2="450" y2="150" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="350" y="145" font-family="Arial" font-size="12">1</text>
  <text x="430" y="145" font-family="Arial" font-size="12">N</text>

</svg>