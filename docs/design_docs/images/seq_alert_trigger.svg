<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect x="10" y="10" width="580" height="380" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  <text x="300" y="40" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">时序图 - 预警触发流程 (Alert Trigger)</text>
  
  <!-- Lifelines -->
  <line x1="100" y1="80" x2="100" y2="350" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="300" y1="80" x2="300" y2="350" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="500" y1="80" x2="500" y2="350" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  
  <rect x="50" y="50" width="100" height="30" fill="#eee" stroke="#333"/>
  <text x="100" y="70" font-family="Arial" font-size="12" text-anchor="middle">库存服务</text>
  
  <rect x="250" y="50" width="100" height="30" fill="#eee" stroke="#333"/>
  <text x="300" y="70" font-family="Arial" font-size="12" text-anchor="middle">预警引擎</text>
  
  <rect x="450" y="50" width="100" height="30" fill="#eee" stroke="#333"/>
  <text x="500" y="70" font-family="Arial" font-size="12" text-anchor="middle">消息队列</text>
  
  <!-- Messages -->
  <line x1="100" y1="120" x2="300" y2="120" stroke="#333" stroke-width="1"/>
  <polygon points="300,120 290,115 290,125" fill="#333"/>
  <text x="200" y="115" font-family="Arial" font-size="11" text-anchor="middle">1. 库存变动通知</text>
  
  <line x1="300" y1="160" x2="300" y2="200" stroke="#333" stroke-width="1"/>
  <path d="M 300 160 C 340 160 340 200 300 200" fill="none" stroke="#333" stroke-width="1"/>
  <polygon points="300,200 305,190 295,190" fill="#333"/>
  <text x="350" y="185" font-family="Arial" font-size="11">2. 检查阈值</text>
  
  <line x1="300" y1="240" x2="500" y2="240" stroke="#333" stroke-width="1"/>
  <polygon points="500,240 490,235 490,245" fill="#333"/>
  <text x="400" y="235" font-family="Arial" font-size="11" text-anchor="middle">3. 发送预警消息</text>
  
  <line x1="500" y1="280" x2="500" y2="320" stroke="#333" stroke-width="1"/>
  <path d="M 500 280 C 540 280 540 320 500 320" fill="none" stroke="#333" stroke-width="1"/>
  <polygon points="500,320 505,310 495,310" fill="#333"/>
  <text x="550" y="305" font-family="Arial" font-size="11">4. 异步推送邮件</text>
</svg>