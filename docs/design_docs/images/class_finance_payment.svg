<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="500" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#333">财务管理模块类图 - 支付与发票 (Class Diagram: Finance Payment &amp; Invoice)</text>

  <!-- Payment Class -->
  <rect x="50" y="80" width="280" height="240" fill="#f0f5ff" stroke="#2f54eb" stroke-width="2"/>
  <path d="M 50 110 L 330 110" stroke="#2f54eb" stroke-width="2"/>
  <text x="190" y="102" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Payment (支付记录)</text>
  <text x="60" y="130" font-family="Arial" font-size="11">- id: Integer {PK}</text>
  <text x="60" y="145" font-family="Arial" font-size="11">- order_id: Integer {FK}</text>
  <text x="60" y="160" font-family="Arial" font-size="11">- amount: Float</text>
  <text x="60" y="175" font-family="Arial" font-size="11">- method: Enum (CASH/ALIPAY/WECHAT)</text>
  <text x="60" y="190" font-family="Arial" font-size="11">- transaction_id: String</text>
  <text x="60" y="205" font-family="Arial" font-size="11">- status: Enum (SUCCESS/FAILED)</text>
  <path d="M 50 220 L 330 220" stroke="#2f54eb" stroke-width="1"/>
  <text x="60" y="240" font-family="Arial" font-size="11">+ process_payment(): bool</text>

  <!-- Invoice Class -->
  <rect x="450" y="80" width="280" height="220" fill="#f0f5ff" stroke="#2f54eb" stroke-width="2"/>
  <path d="M 450 110 L 730 110" stroke="#2f54eb" stroke-width="2"/>
  <text x="590" y="102" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Invoice (发票实体)</text>
  <text x="460" y="130" font-family="Arial" font-size="11">- id: Integer {PK}</text>
  <text x="460" y="145" font-family="Arial" font-size="11">- invoice_no: String</text>
  <text x="460" y="160" font-family="Arial" font-size="11">- order_id: Integer {FK}</text>
  <text x="460" y="175" font-family="Arial" font-size="11">- tax_id: String (税号)</text>
  <text x="460" y="190" font-family="Arial" font-size="11">- title: String (抬头)</text>
  <path d="M 450 210 L 730 210" stroke="#2f54eb" stroke-width="1"/>
  <text x="460" y="230" font-family="Arial" font-size="11">+ generate_pdf(): String</text>

  <!-- Relationships -->
  <line x1="330" y1="150" x2="450" y2="150" stroke="#8c8c8c" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="390" y="145" font-family="Arial" font-size="11" text-anchor="middle">Related</text>

</svg>