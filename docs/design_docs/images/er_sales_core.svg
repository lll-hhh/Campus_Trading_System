<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="500" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#333">ER 图 - 销售核心数据 (ER Diagram: Sales Core)</text>

  <!-- Table: customers -->
  <rect x="50" y="100" width="200" height="160" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="2"/>
  <text x="150" y="130" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">customers</text>
  <line x1="50" y1="140" x2="250" y2="140" stroke="#722ed1" stroke-width="2"/>
  <text x="60" y="160" font-family="Arial" font-size="12" font-weight="bold">PK: id</text>
  <text x="60" y="180" font-family="Arial" font-size="12">name</text>
  <text x="60" y="200" font-family="Arial" font-size="12">phone (U)</text>
  <text x="60" y="220" font-family="Arial" font-size="12">credit_limit</text>
  <text x="60" y="240" font-family="Arial" font-size="12">balance</text>

  <!-- Table: orders -->
  <rect x="400" y="100" width="200" height="180" rx="10" fill="#e6f7ff" stroke="#1890ff" stroke-width="2"/>
  <text x="500" y="130" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">orders</text>
  <line x1="400" y1="140" x2="600" y2="140" stroke="#1890ff" stroke-width="2"/>
  <text x="410" y="160" font-family="Arial" font-size="12" font-weight="bold">PK: id</text>
  <text x="410" y="180" font-family="Arial" font-size="12">order_no (U)</text>
  <text x="410" y="200" font-family="Arial" font-size="12">FK: customer_id</text>
  <text x="410" y="220" font-family="Arial" font-size="12">total_amount</text>
  <text x="410" y="240" font-family="Arial" font-size="12">status</text>
  <text x="410" y="260" font-family="Arial" font-size="12">created_at</text>

  <!-- Table: order_details -->
  <rect x="750" y="100" width="200" height="160" rx="10" fill="#e6f7ff" stroke="#1890ff" stroke-width="2"/>
  <text x="850" y="130" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">order_details</text>
  <line x1="750" y1="140" x2="950" y2="140" stroke="#1890ff" stroke-width="2"/>
  <text x="760" y="160" font-family="Arial" font-size="12" font-weight="bold">PK: id</text>
  <text x="760" y="180" font-family="Arial" font-size="12">FK: order_id</text>
  <text x="760" y="200" font-family="Arial" font-size="12">FK: part_id</text>
  <text x="760" y="220" font-family="Arial" font-size="12">quantity</text>
  <text x="760" y="240" font-family="Arial" font-size="12">unit_price</text>

  <!-- Relationships -->
  <line x1="250" y1="180" x2="400" y2="180" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="325" y="170" font-family="Arial" font-size="12" text-anchor="middle">1 : N</text>
  
  <line x1="600" y1="180" x2="750" y2="180" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="675" y="170" font-family="Arial" font-size="12" text-anchor="middle">1 : N</text>

</svg>