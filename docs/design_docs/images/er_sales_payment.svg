<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="500" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#333">ER 图 - 支付与交易 (ER Diagram: Sales Payment)</text>

  <!-- Table: payments -->
  <rect x="400" y="100" width="200" height="160" rx="10" rx="10" fill="#f0f5ff" stroke="#2f54eb" stroke-width="2"/>
  <text x="500" y="130" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">payments</text>
  <line x1="400" y1="140" x2="600" y2="140" stroke="#2f54eb" stroke-width="2"/>
  <text x="410" y="160" font-family="Arial" font-size="12" font-weight="bold">PK: id</text>
  <text x="410" y="180" font-family="Arial" font-size="12">FK: order_id</text>
  <text x="410" y="200" font-family="Arial" font-size="12">amount</text>
  <text x="410" y="220" font-family="Arial" font-size="12">method</text>
  <text x="410" y="240" font-family="Arial" font-size="12">transaction_id</text>

  <!-- Table: invoices -->
  <rect x="400" y="350" width="200" height="140" rx="10" fill="#f0f5ff" stroke="#2f54eb" stroke-width="2"/>
  <text x="500" y="380" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">invoices</text>
  <line x1="400" y1="390" x2="600" y2="390" stroke="#2f54eb" stroke-width="2"/>
  <text x="410" y="410" font-family="Arial" font-size="12" font-weight="bold">PK: id</text>
  <text x="410" y="430" font-family="Arial" font-size="12">FK: order_id</text>
  <text x="410" y="450" font-family="Arial" font-size="12">invoice_no</text>
  <text x="410" y="470" font-family="Arial" font-size="12">tax_id</text>

  <!-- Relationships -->
  <line x1="500" y1="260" x2="500" y2="350" stroke="#8c8c8c" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="510" y="310" font-family="Arial" font-size="11">Related by order_id</text>

</svg>