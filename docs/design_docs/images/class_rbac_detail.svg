<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="500" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#333">核心业务类图 - 用户与权限模块 (Class Diagram - RBAC)</text>

  <!-- User Class -->
  <rect x="50" y="60" width="250" height="200" fill="#fffbe6" stroke="#faad14" stroke-width="2"/>
  <path d="M 50 90 L 300 90" stroke="#faad14" stroke-width="2"/>
  <text x="175" y="82" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">User (用户)</text>
  <text x="60" y="110" font-family="Arial" font-size="11">+ id: int</text>
  <text x="60" y="125" font-family="Arial" font-size="11">+ username: string</text>
  <text x="60" y="140" font-family="Arial" font-size="11">+ email: string</text>
  <text x="60" y="155" font-family="Arial" font-size="11">+ hashed_password: string</text>
  <text x="60" y="170" font-family="Arial" font-size="11">+ is_active: bool</text>
  <path d="M 50 180 L 300 180" stroke="#faad14" stroke-width="1"/>
  <text x="60" y="200" font-family="Arial" font-size="11">+ verify_password(pwd): bool</text>

  <!-- Role Class -->
  <rect x="450" y="60" width="200" height="120" fill="#fffbe6" stroke="#faad14" stroke-width="2"/>
  <path d="M 450 90 L 650 90" stroke="#faad14" stroke-width="2"/>
  <text x="550" y="82" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Role (角色)</text>
  <text x="460" y="110" font-family="Arial" font-size="11">+ id: int</text>
  <text x="460" y="125" font-family="Arial" font-size="11">+ name: string (Admin/Staff)</text>
  <text x="460" y="140" font-family="Arial" font-size="11">+ description: string</text>

  <!-- Permission Class -->
  <rect x="750" y="60" width="200" height="120" fill="#fffbe6" stroke="#faad14" stroke-width="2"/>
  <path d="M 750 90 L 950 90" stroke="#faad14" stroke-width="2"/>
  <text x="850" y="82" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Permission (权限)</text>
  <text x="760" y="110" font-family="Arial" font-size="11">+ id: int</text>
  <text x="760" y="125" font-family="Arial" font-size="11">+ code: string (part:create)</text>
  <text x="760" y="140" font-family="Arial" font-size="11">+ name: string</text>

  <!-- AuditLog Class -->
  <rect x="50" y="350" width="250" height="180" fill="#fffbe6" stroke="#faad14" stroke-width="2"/>
  <path d="M 50 380 L 300 380" stroke="#faad14" stroke-width="2"/>
  <text x="175" y="372" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">AuditLog (审计日志)</text>
  <text x="60" y="400" font-family="Arial" font-size="11">+ id: int</text>
  <text x="60" y="415" font-family="Arial" font-size="11">+ user_id: int</text>
  <text x="60" y="430" font-family="Arial" font-size="11">+ action: string</text>
  <text x="60" y="445" font-family="Arial" font-size="11">+ target_table: string</text>
  <text x="60" y="460" font-family="Arial" font-size="11">+ target_id: int</text>
  <text x="60" y="475" font-family="Arial" font-size="11">+ ip_address: string</text>
  <text x="60" y="490" font-family="Arial" font-size="11">+ created_at: datetime</text>

  <!-- Relationships -->
  <line x1="300" y1="120" x2="450" y2="120" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="375" y="115" font-family="Arial" font-size="10" text-anchor="middle">n..m</text>
  
  <line x1="650" y1="120" x2="750" y2="120" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="700" y="115" font-family="Arial" font-size="10" text-anchor="middle">n..m</text>
  
  <line x1="175" y1="260" x2="175" y2="350" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="185" y="305" font-family="Arial" font-size="10">1..n</text>
</svg>