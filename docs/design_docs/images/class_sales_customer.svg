<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="500" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#333">销售管理模块类图 - 客户与信用 (Class Diagram: Sales Customer &amp; Credit)</text>

  <!-- Customer Class -->
  <rect x="50" y="80" width="280" height="240" fill="#f9f0ff" stroke="#722ed1" stroke-width="2"/>
  <path d="M 50 110 L 330 110" stroke="#722ed1" stroke-width="2"/>
  <text x="190" y="102" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Customer (客户实体)</text>
  <text x="60" y="130" font-family="Arial" font-size="11">- id: Integer {PK}</text>
  <text x="60" y="145" font-family="Arial" font-size="11">- name: String (客户名称)</text>
  <text x="60" y="160" font-family="Arial" font-size="11">- phone: String (联系电话)</text>
  <text x="60" y="175" font-family="Arial" font-size="11">- address: String</text>
  <text x="60" y="190" font-family="Arial" font-size="11">- credit_limit: Float (信用额度)</text>
  <text x="60" y="205" font-family="Arial" font-size="11">- balance: Float (当前欠款)</text>
  <path d="M 50 220 L 330 220" stroke="#722ed1" stroke-width="1"/>
  <text x="60" y="240" font-family="Arial" font-size="11">+ check_credit(amount): bool</text>
  <text x="60" y="255" font-family="Arial" font-size="11">+ update_balance(delta): void</text>

  <!-- CustomerLevel Class -->
  <rect x="450" y="80" width="250" height="150" fill="#f9f0ff" stroke="#722ed1" stroke-width="2"/>
  <path d="M 450 110 L 700 110" stroke="#722ed1" stroke-width="2"/>
  <text x="575" y="102" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">CustomerLevel (等级)</text>
  <text x="460" y="130" font-family="Arial" font-size="11">- id: Integer {PK}</text>
  <text x="460" y="145" font-family="Arial" font-size="11">- level_name: String (普通/VIP/核心)</text>
  <text x="460" y="160" font-family="Arial" font-size="11">- discount_rate: Float (折扣率)</text>

  <!-- Relationships -->
  <line x1="330" y1="150" x2="450" y2="150" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="350" y="145" font-family="Arial" font-size="12">N</text>
  <text x="430" y="145" font-family="Arial" font-size="12">1</text>

</svg>