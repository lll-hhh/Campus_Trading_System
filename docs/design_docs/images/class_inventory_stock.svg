<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="500" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#333">库存管理模块类图 - 库存与仓库 (Class Diagram: Inventory Stock &amp; Warehouse)</text>

  <!-- Inventory Class -->
  <rect x="50" y="80" width="280" height="220" fill="#fff1f0" stroke="#ff4d4f" stroke-width="2"/>
  <path d="M 50 110 L 330 110" stroke="#ff4d4f" stroke-width="2"/>
  <text x="190" y="102" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Inventory (库存实体)</text>
  <text x="60" y="130" font-family="Arial" font-size="11">- id: Integer {PK}</text>
  <text x="60" y="145" font-family="Arial" font-size="11">- part_id: Integer {FK, U}</text>
  <text x="60" y="160" font-family="Arial" font-size="11">- quantity: Integer (当前数量)</text>
  <text x="60" y="175" font-family="Arial" font-size="11">- min_threshold: Integer (预警下限)</text>
  <text x="60" y="190" font-family="Arial" font-size="11">- location: String (库位)</text>
  <path d="M 50 210 L 330 210" stroke="#ff4d4f" stroke-width="1"/>
  <text x="60" y="230" font-family="Arial" font-size="11">+ adjust_quantity(delta): void</text>
  <text x="60" y="245" font-family="Arial" font-size="11">+ is_low_stock(): bool</text>

  <!-- StockLog Class -->
  <rect x="450" y="80" width="280" height="240" fill="#fff1f0" stroke="#ff4d4f" stroke-width="2"/>
  <path d="M 450 110 L 730 110" stroke="#ff4d4f" stroke-width="2"/>
  <text x="590" y="102" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">StockLog (出入库日志)</text>
  <text x="460" y="130" font-family="Arial" font-size="11">- id: Integer {PK}</text>
  <text x="460" y="145" font-family="Arial" font-size="11">- part_id: Integer {FK}</text>
  <text x="460" y="160" font-family="Arial" font-size="11">- change_qty: Integer</text>
  <text x="460" y="175" font-family="Arial" font-size="11">- type: Enum (IN/OUT/ADJUST)</text>
  <text x="460" y="190" font-family="Arial" font-size="11">- operator_id: Integer {FK}</text>
  <text x="460" y="205" font-family="Arial" font-size="11">- created_at: DateTime</text>
  <text x="460" y="220" font-family="Arial" font-size="11">- remark: String</text>

  <!-- Relationships -->
  <line x1="330" y1="150" x2="450" y2="150" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="350" y="145" font-family="Arial" font-size="12">1</text>
  <text x="430" y="145" font-family="Arial" font-size="12">N</text>

</svg>