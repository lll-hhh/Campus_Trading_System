<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect x="10" y="10" width="580" height="380" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  <text x="300" y="40" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">时序图 - 权限校验流程 (Permission Check)</text>
  
  <!-- Lifelines -->
  <line x1="100" y1="80" x2="100" y2="350" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="300" y1="80" x2="300" y2="350" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <line x1="500" y1="80" x2="500" y2="350" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  
  <rect x="50" y="50" width="100" height="30" fill="#eee" stroke="#333"/>
  <text x="100" y="70" font-family="Arial" font-size="12" text-anchor="middle">API 路由</text>
  
  <rect x="250" y="50" width="100" height="30" fill="#eee" stroke="#333"/>
  <text x="300" y="70" font-family="Arial" font-size="12" text-anchor="middle">权限拦截器</text>
  
  <rect x="450" y="50" width="100" height="30" fill="#eee" stroke="#333"/>
  <text x="500" y="70" font-family="Arial" font-size="12" text-anchor="middle">Redis 缓存</text>
  
  <!-- Messages -->
  <line x1="100" y1="120" x2="300" y2="120" stroke="#333" stroke-width="1"/>
  <polygon points="300,120 290,115 290,125" fill="#333"/>
  <text x="200" y="115" font-family="Arial" font-size="11" text-anchor="middle">1. 拦截请求</text>
  
  <line x1="300" y1="160" x2="500" y2="160" stroke="#333" stroke-width="1"/>
  <polygon points="500,160 490,155 490,165" fill="#333"/>
  <text x="400" y="155" font-family="Arial" font-size="11" text-anchor="middle">2. 获取用户权限集</text>
  
  <line x1="500" y1="200" x2="300" y2="200" stroke="#333" stroke-width="1" stroke-dasharray="5,5"/>
  <polygon points="300,200 310,195 310,205" fill="#333"/>
  <text x="400" y="195" font-family="Arial" font-size="11" text-anchor="middle">3. 返回权限列表</text>
  
  <line x1="300" y1="240" x2="300" y2="280" stroke="#333" stroke-width="1"/>
  <path d="M 300 240 C 340 240 340 280 300 280" fill="none" stroke="#333" stroke-width="1"/>
  <polygon points="300,280 305,270 295,270" fill="#333"/>
  <text x="350" y="265" font-family="Arial" font-size="11">4. 匹配当前路由权限</text>
  
  <line x1="300" y1="320" x2="100" y2="320" stroke="#333" stroke-width="1" stroke-dasharray="5,5"/>
  <polygon points="100,320 110,315 110,325" fill="#333"/>
  <text x="200" y="315" font-family="Arial" font-size="11" text-anchor="middle">5. 放行或返回 403</text>
</svg>