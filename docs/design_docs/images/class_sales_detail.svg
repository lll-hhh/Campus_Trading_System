<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="500" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#333">核心业务类图 - 销售与订单模块 (Class Diagram - Sales)</text>

  <!-- Order Class -->
  <rect x="50" y="60" width="250" height="220" fill="#e6f7ff" stroke="#1890ff" stroke-width="2"/>
  <path d="M 50 90 L 300 90" stroke="#1890ff" stroke-width="2"/>
  <text x="175" y="82" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Order (销售订单)</text>
  <text x="60" y="110" font-family="Arial" font-size="11">+ id: int</text>
  <text x="60" y="125" font-family="Arial" font-size="11">+ order_no: string (订单号)</text>
  <text x="60" y="140" font-family="Arial" font-size="11">+ customer_id: int</text>
  <text x="60" y="155" font-family="Arial" font-size="11">+ total_amount: float</text>
  <text x="60" y="170" font-family="Arial" font-size="11">+ status: enum (PENDING/PAID/CANCEL)</text>
  <text x="60" y="185" font-family="Arial" font-size="11">+ created_at: datetime</text>
  <path d="M 50 200 L 300 200" stroke="#1890ff" stroke-width="1"/>
  <text x="60" y="220" font-family="Arial" font-size="11">+ calculate_total()</text>
  <text x="60" y="235" font-family="Arial" font-size="11">+ update_status(new_status)</text>

  <!-- OrderDetail Class -->
  <rect x="450" y="60" width="200" height="150" fill="#e6f7ff" stroke="#1890ff" stroke-width="2"/>
  <path d="M 450 90 L 650 90" stroke="#1890ff" stroke-width="2"/>
  <text x="550" y="82" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">OrderDetail (订单详情)</text>
  <text x="460" y="110" font-family="Arial" font-size="11">+ id: int</text>
  <text x="460" y="125" font-family="Arial" font-size="11">+ order_id: int</text>
  <text x="460" y="140" font-family="Arial" font-size="11">+ part_id: int</text>
  <text x="460" y="155" font-family="Arial" font-size="11">+ quantity: int</text>
  <text x="460" y="170" font-family="Arial" font-size="11">+ unit_price: float</text>
  <text x="460" y="185" font-family="Arial" font-size="11">+ subtotal: float</text>

  <!-- Payment Class -->
  <rect x="50" y="350" width="250" height="150" fill="#e6f7ff" stroke="#1890ff" stroke-width="2"/>
  <path d="M 50 380 L 300 380" stroke="#1890ff" stroke-width="2"/>
  <text x="175" y="372" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Payment (支付记录)</text>
  <text x="60" y="400" font-family="Arial" font-size="11">+ id: int</text>
  <text x="60" y="415" font-family="Arial" font-size="11">+ order_id: int</text>
  <text x="60" y="430" font-family="Arial" font-size="11">+ amount: float</text>
  <text x="60" y="445" font-family="Arial" font-size="11">+ method: string (Cash/Card/AliPay)</text>
  <text x="60" y="460" font-family="Arial" font-size="11">+ transaction_id: string</text>

  <!-- Customer Class -->
  <rect x="750" y="60" width="200" height="150" fill="#f9f0ff" stroke="#722ed1" stroke-width="2"/>
  <path d="M 750 90 L 950 90" stroke="#722ed1" stroke-width="2"/>
  <text x="850" y="82" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Customer (客户)</text>
  <text x="760" y="110" font-family="Arial" font-size="11">+ id: int</text>
  <text x="760" y="125" font-family="Arial" font-size="11">+ name: string</text>
  <text x="760" y="140" font-family="Arial" font-size="11">+ phone: string</text>
  <text x="760" y="155" font-family="Arial" font-size="11">+ credit_limit: float</text>

  <!-- Relationships -->
  <line x1="300" y1="120" x2="450" y2="120" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="375" y="115" font-family="Arial" font-size="10" text-anchor="middle">1..n</text>
  
  <line x1="175" y1="280" x2="175" y2="350" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="185" y="315" font-family="Arial" font-size="10">1..1</text>
  
  <line x1="300" y1="150" x2="750" y2="150" stroke="#8c8c8c" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="525" y="145" font-family="Arial" font-size="10" text-anchor="middle">n..1</text>
</svg>