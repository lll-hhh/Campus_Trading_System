<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="500" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#333">业务流程时序图 - 权限校验 (Sequence Diagram: RBAC Check)</text>

  <!-- Lifelines -->
  <line x1="100" y1="80" x2="100" y2="550" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <rect x="50" y="50" width="100" height="30" fill="#e6f7ff" stroke="#1890ff"/>
  <text x="100" y="70" font-family="Arial" font-size="12" text-anchor="middle">前端请求</text>

  <line x1="300" y1="80" x2="300" y2="550" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <rect x="250" y="50" width="100" height="30" fill="#f6ffed" stroke="#52c41a"/>
  <text x="300" y="70" font-family="Arial" font-size="12" text-anchor="middle">API 网关</text>

  <line x1="500" y1="80" x2="500" y2="550" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <rect x="450" y="50" width="100" height="30" fill="#fff7e6" stroke="#ffa940"/>
  <text x="500" y="70" font-family="Arial" font-size="12" text-anchor="middle">RBAC 拦截器</text>

  <line x1="700" y1="80" x2="700" y2="550" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <rect x="650" y="50" width="100" height="30" fill="#fff0f6" stroke="#eb2f96"/>
  <text x="700" y="70" font-family="Arial" font-size="12" text-anchor="middle">Redis (Perm Cache)</text>

  <line x1="900" y1="80" x2="900" y2="550" stroke="#333" stroke-width="2" stroke-dasharray="5,5"/>
  <rect x="850" y="50" width="100" height="30" fill="#f0f0f0" stroke="#333"/>
  <text x="900" y="70" font-family="Arial" font-size="12" text-anchor="middle">业务服务</text>

  <!-- Messages -->
  <path d="M 100 120 L 300 120" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="200" y="115" font-family="Arial" font-size="11" text-anchor="middle">1. 发起业务请求 (带 Token)</text>

  <path d="M 300 160 L 500 160" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="400" y="155" font-family="Arial" font-size="11" text-anchor="middle">2. 提取 UserID &amp; 资源路径</text>

  <path d="M 500 200 L 700 200" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="600" y="195" font-family="Arial" font-size="11" text-anchor="middle">3. 查询用户权限缓存</text>

  <path d="M 700 240 L 500 240" stroke="#333" stroke-width="1.5" stroke-dasharray="3,3" fill="none" marker-end="url(#arrow)"/>
  <text x="600" y="235" font-family="Arial" font-size="11" text-anchor="middle">4. 返回权限列表</text>

  <path d="M 500 280 L 500 320 L 450 320 L 500 320" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="310" font-family="Arial" font-size="11" text-anchor="middle">5. 匹配资源权限</text>

  <path d="M 500 360 L 900 360" stroke="#333" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
  <text x="700" y="355" font-family="Arial" font-size="11" text-anchor="middle">6. 校验通过，转发请求</text>

  <path d="M 900 400 L 100 400" stroke="#333" stroke-width="1.5" stroke-dasharray="3,3" fill="none" marker-end="url(#arrow)"/>
  <text x="500" y="395" font-family="Arial" font-size="11" text-anchor="middle">7. 返回业务数据</text>

  <!-- Arrow Marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#333" />
    </marker>
  </defs>
</svg>