<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- User Class -->
  <rect x="50" y="50" width="180" height="120" fill="#fffbe6" stroke="#faad14" stroke-width="2"/>
  <path d="M 50 80 L 230 80" stroke="#faad14" stroke-width="2"/>
  <text x="140" y="72" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">User</text>
  <text x="60" y="100" font-family="Arial" font-size="12">+ id: int</text>
  <text x="60" y="115" font-family="Arial" font-size="12">+ username: string</text>
  <text x="60" y="130" font-family="Arial" font-size="12">+ role: string</text>
  <path d="M 50 140 L 230 140" stroke="#faad14" stroke-width="1"/>
  <text x="60" y="160" font-family="Arial" font-size="12">+ login()</text>

  <!-- Order Class -->
  <rect x="310" y="50" width="180" height="140" fill="#e6f7ff" stroke="#1890ff" stroke-width="2"/>
  <path d="M 310 80 L 490 80" stroke="#1890ff" stroke-width="2"/>
  <text x="400" y="72" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Order</text>
  <text x="320" y="100" font-family="Arial" font-size="12">+ id: int</text>
  <text x="320" y="115" font-family="Arial" font-size="12">+ user_id: int</text>
  <text x="320" y="130" font-family="Arial" font-size="12">+ total_amount: float</text>
  <text x="320" y="145" font-family="Arial" font-size="12">+ status: string</text>
  <path d="M 310 155 L 490 155" stroke="#1890ff" stroke-width="1"/>
  <text x="320" y="175" font-family="Arial" font-size="12">+ create_order()</text>

  <!-- OrderDetail Class -->
  <rect x="310" y="300" width="180" height="120" fill="#e6f7ff" stroke="#1890ff" stroke-width="2"/>
  <path d="M 310 330 L 490 330" stroke="#1890ff" stroke-width="2"/>
  <text x="400" y="322" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">OrderDetail</text>
  <text x="320" y="350" font-family="Arial" font-size="12">+ id: int</text>
  <text x="320" y="365" font-family="Arial" font-size="12">+ order_id: int</text>
  <text x="320" y="380" font-family="Arial" font-size="12">+ part_id: int</text>
  <text x="320" y="395" font-family="Arial" font-size="12">+ quantity: int</text>

  <!-- Part Class -->
  <rect x="570" y="300" width="180" height="140" fill="#f6ffed" stroke="#52c41a" stroke-width="2"/>
  <path d="M 570 330 L 750 330" stroke="#52c41a" stroke-width="2"/>
  <text x="660" y="322" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Part</text>
  <text x="580" y="350" font-family="Arial" font-size="12">+ id: int</text>
  <text x="580" y="365" font-family="Arial" font-size="12">+ oe_number: string</text>
  <text x="580" y="380" font-family="Arial" font-size="12">+ current_stock: int</text>
  <path d="M 570 390 L 750 390" stroke="#52c41a" stroke-width="1"/>
  <text x="580" y="410" font-family="Arial" font-size="12">+ update_stock()</text>

  <!-- InventoryLog Class -->
  <rect x="570" y="50" width="180" height="120" fill="#f6ffed" stroke="#52c41a" stroke-width="2"/>
  <path d="M 570 80 L 750 80" stroke="#52c41a" stroke-width="2"/>
  <text x="660" y="72" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">InventoryLog</text>
  <text x="580" y="100" font-family="Arial" font-size="12">+ id: int</text>
  <text x="580" y="115" font-family="Arial" font-size="12">+ part_id: int</text>
  <text x="580" y="130" font-family="Arial" font-size="12">+ type: string</text>

  <!-- Relationships -->
  <line x1="230" y1="110" x2="310" y2="110" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="270" y="105" font-family="Arial" font-size="10" text-anchor="middle">1..*</text>
  
  <line x1="400" y1="190" x2="400" y2="300" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="410" y="245" font-family="Arial" font-size="10">1..*</text>
  
  <line x1="490" y1="360" x2="570" y2="360" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="530" y="355" font-family="Arial" font-size="10" text-anchor="middle">1..*</text>
  
  <line x1="660" y1="170" x2="660" y2="300" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="670" y="235" font-family="Arial" font-size="10">1..*</text>
</svg>