<svg width="1000" height="800" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="500" y="40" font-family="Arial" font-size="24" text-anchor="middle" font-weight="bold" fill="#333">实体关系图 (ER Diagram) - 销售与交易数据</text>

  <!-- Entity: Customer -->
  <rect x="50" y="300" width="200" height="160" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="2"/>
  <text x="150" y="330" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Customer (客户)</text>
  <line x1="50" y1="340" x2="250" y2="340" stroke="#722ed1" stroke-width="2"/>
  <text x="60" y="360" font-family="Arial" font-size="12" font-weight="bold">PK: id</text>
  <text x="60" y="380" font-family="Arial" font-size="12">name</text>
  <text x="60" y="400" font-family="Arial" font-size="12">phone (U)</text>
  <text x="60" y="420" font-family="Arial" font-size="12">email</text>
  <text x="60" y="440" font-family="Arial" font-size="12">credit_limit</text>

  <!-- Entity: Order -->
  <rect x="400" y="300" width="200" height="180" rx="10" fill="#e6f7ff" stroke="#1890ff" stroke-width="2"/>
  <text x="500" y="330" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Order (订单)</text>
  <line x1="400" y1="340" x2="600" y2="340" stroke="#1890ff" stroke-width="2"/>
  <text x="410" y="360" font-family="Arial" font-size="12" font-weight="bold">PK: id</text>
  <text x="410" y="380" font-family="Arial" font-size="12">order_no (U)</text>
  <text x="410" y="400" font-family="Arial" font-size="12">FK: customer_id</text>
  <text x="410" y="420" font-family="Arial" font-size="12">total_amount</text>
  <text x="410" y="440" font-family="Arial" font-size="12">status</text>
  <text x="410" y="460" font-family="Arial" font-size="12">created_at</text>

  <!-- Entity: OrderDetail -->
  <rect x="750" y="300" width="200" height="160" rx="10" fill="#e6f7ff" stroke="#1890ff" stroke-width="2"/>
  <text x="850" y="330" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">OrderDetail (详情)</text>
  <line x1="750" y1="340" x2="950" y2="340" stroke="#1890ff" stroke-width="2"/>
  <text x="760" y="360" font-family="Arial" font-size="12" font-weight="bold">PK: id</text>
  <text x="760" y="380" font-family="Arial" font-size="12">FK: order_id</text>
  <text x="760" y="400" font-family="Arial" font-size="12">FK: part_id</text>
  <text x="760" y="420" font-family="Arial" font-size="12">quantity</text>
  <text x="760" y="440" font-family="Arial" font-size="12">unit_price</text>

  <!-- Entity: Payment -->
  <rect x="400" y="600" width="200" height="140" rx="10" fill="#f0f5ff" stroke="#2f54eb" stroke-width="2"/>
  <text x="500" y="630" font-family="Arial" font-size="18" text-anchor="middle" font-weight="bold">Payment (支付)</text>
  <line x1="400" y1="640" x2="600" y2="640" stroke="#2f54eb" stroke-width="2"/>
  <text x="410" y="660" font-family="Arial" font-size="12" font-weight="bold">PK: id</text>
  <text x="410" y="680" font-family="Arial" font-size="12">FK: order_id</text>
  <text x="410" y="700" font-family="Arial" font-size="12">amount</text>
  <text x="410" y="720" font-family="Arial" font-size="12">method</text>

  <!-- Relationships -->
  <!-- Customer to Order -->
  <line x1="250" y1="380" x2="400" y2="380" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="325" y="375" font-family="Arial" font-size="12" text-anchor="middle">1 : N</text>
  <path d="M 390 375 L 400 380 L 390 385" fill="none" stroke="#8c8c8c" stroke-width="1.5"/>

  <!-- Order to OrderDetail -->
  <line x1="600" y1="380" x2="750" y2="380" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="675" y="375" font-family="Arial" font-size="12" text-anchor="middle">1 : N</text>
  <path d="M 740 375 L 750 380 L 740 385" fill="none" stroke="#8c8c8c" stroke-width="1.5"/>

  <!-- Order to Payment -->
  <line x1="500" y1="480" x2="500" y2="600" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="510" y="540" font-family="Arial" font-size="12">1 : 1</text>
  <circle cx="500" cy="595" r="3" fill="#8c8c8c"/>

</svg>