<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect x="10" y="10" width="580" height="380" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  <text x="300" y="40" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">类图 - 供应商管理模块 (Supplier Management)</text>
  
  <!-- Supplier Class -->
  <rect x="50" y="80" width="180" height="120" fill="#fff" stroke="#0056b3" stroke-width="2"/>
  <line x1="50" y1="110" x2="230" y2="110" stroke="#0056b3" stroke-width="2"/>
  <text x="140" y="100" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">Supplier</text>
  <text x="60" y="130" font-family="Arial" font-size="12">- id: Integer</text>
  <text x="60" y="145" font-family="Arial" font-size="12">- name: String</text>
  <text x="60" y="160" font-family="Arial" font-size="12">- contact: String</text>
  <text x="60" y="175" font-family="Arial" font-size="12">- phone: String</text>
  
  <!-- ProcurementRecord Class -->
  <rect x="350" y="80" width="200" height="120" fill="#fff" stroke="#0056b3" stroke-width="2"/>
  <line x1="350" y1="110" x2="550" y2="110" stroke="#0056b3" stroke-width="2"/>
  <text x="450" y="100" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">ProcurementRecord</text>
  <text x="360" y="130" font-family="Arial" font-size="12">- id: Integer</text>
  <text x="360" y="145" font-family="Arial" font-size="12">- supplier_id: Integer</text>
  <text x="360" y="160" font-family="Arial" font-size="12">- total_amount: Float</text>
  <text x="360" y="175" font-family="Arial" font-size="12">- status: String</text>
  
  <!-- Relationship -->
  <line x1="230" y1="140" x2="350" y2="140" stroke="#333" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="290" y="135" font-family="Arial" font-size="12" text-anchor="middle">1..*</text>
</svg>