<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="500" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#333">权限管理模块类图 - 用户与角色 (Class Diagram: RBAC User &amp; Role)</text>

  <!-- User Class -->
  <rect x="50" y="80" width="250" height="240" fill="#e6f7ff" stroke="#1890ff" stroke-width="2"/>
  <path d="M 50 110 L 300 110" stroke="#1890ff" stroke-width="2"/>
  <text x="175" y="102" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">User (用户实体)</text>
  <text x="60" y="130" font-family="Arial" font-size="11">- id: Integer {PK}</text>
  <text x="60" y="145" font-family="Arial" font-size="11">- username: String (用户名)</text>
  <text x="60" y="160" font-family="Arial" font-size="11">- hashed_password: String</text>
  <text x="60" y="175" font-family="Arial" font-size="11">- full_name: String</text>
  <text x="60" y="190" font-family="Arial" font-size="11">- email: String</text>
  <text x="60" y="205" font-family="Arial" font-size="11">- is_active: Boolean</text>
  <text x="60" y="220" font-family="Arial" font-size="11">- last_login: DateTime</text>
  <path d="M 50 230 L 300 230" stroke="#1890ff" stroke-width="1"/>
  <text x="60" y="250" font-family="Arial" font-size="11">+ verify_password(pwd): bool</text>
  <text x="60" y="265" font-family="Arial" font-size="11">+ get_all_permissions(): List</text>
  <text x="60" y="280" font-family="Arial" font-size="11">+ update_last_login(): void</text>

  <!-- Role Class -->
  <rect x="450" y="80" width="250" height="180" fill="#f6ffed" stroke="#52c41a" stroke-width="2"/>
  <path d="M 450 110 L 700 110" stroke="#52c41a" stroke-width="2"/>
  <text x="575" y="102" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">Role (角色实体)</text>
  <text x="460" y="130" font-family="Arial" font-size="11">- id: Integer {PK}</text>
  <text x="460" y="145" font-family="Arial" font-size="11">- name: String (角色名)</text>
  <text x="460" y="160" font-family="Arial" font-size="11">- code: String (标识符)</text>
  <text x="460" y="175" font-family="Arial" font-size="11">- description: String</text>
  <path d="M 450 190 L 700 190" stroke="#52c41a" stroke-width="1"/>
  <text x="460" y="210" font-family="Arial" font-size="11">+ add_permission(perm): void</text>
  <text x="460" y="225" font-family="Arial" font-size="11">+ remove_permission(perm): void</text>

  <!-- UserRole Association -->
  <rect x="280" y="380" width="180" height="80" fill="#fff7e6" stroke="#ffa940" stroke-width="1" stroke-dasharray="5,5"/>
  <text x="370" y="405" font-family="Arial" font-size="14" text-anchor="middle" font-weight="bold">UserRole (关联表)</text>
  <text x="290" y="425" font-family="Arial" font-size="11">- user_id: Integer</text>
  <text x="290" y="440" font-family="Arial" font-size="11">- role_id: Integer</text>

  <!-- Relationships -->
  <line x1="300" y1="150" x2="450" y2="150" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="320" y="145" font-family="Arial" font-size="12">N</text>
  <text x="430" y="145" font-family="Arial" font-size="12">M</text>
  
  <path d="M 175 320 L 175 420 L 280 420" fill="none" stroke="#8c8c8c" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 575 260 L 575 420 L 460 420" fill="none" stroke="#8c8c8c" stroke-width="1" stroke-dasharray="3,3"/>

</svg>