<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="500" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#333">ER 图 - 库存动态数据 (ER Diagram: Inventory Stock)</text>

  <!-- Table: inventory -->
  <rect x="50" y="100" width="200" height="140" rx="10" fill="#fff1f0" stroke="#ff4d4f" stroke-width="2"/>
  <text x="150" y="130" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">inventory</text>
  <line x1="50" y1="140" x2="250" y2="140" stroke="#ff4d4f" stroke-width="2"/>
  <text x="60" y="160" font-family="Arial" font-size="12" font-weight="bold">PK: id</text>
  <text x="60" y="180" font-family="Arial" font-size="12">FK: part_id (U)</text>
  <text x="60" y="200" font-family="Arial" font-size="12">quantity</text>
  <text x="60" y="220" font-family="Arial" font-size="12">location</text>

  <!-- Table: stock_logs -->
  <rect x="400" y="100" width="200" height="180" rx="10" fill="#fff1f0" stroke="#ff4d4f" stroke-width="2"/>
  <text x="500" y="130" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">stock_logs</text>
  <line x1="400" y1="140" x2="600" y2="140" stroke="#ff4d4f" stroke-width="2"/>
  <text x="410" y="160" font-family="Arial" font-size="12" font-weight="bold">PK: id</text>
  <text x="410" y="180" font-family="Arial" font-size="12">FK: part_id</text>
  <text x="410" y="200" font-family="Arial" font-size="12">change_qty</text>
  <text x="410" y="220" font-family="Arial" font-size="12">type (IN/OUT)</text>
  <text x="410" y="240" font-family="Arial" font-size="12">FK: operator_id</text>
  <text x="410" y="260" font-family="Arial" font-size="12">created_at</text>

  <!-- Table: warehouse_locations -->
  <rect x="50" y="350" width="200" height="120" rx="10" fill="#f9f0ff" stroke="#722ed1" stroke-width="2"/>
  <text x="150" y="380" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">locations</text>
  <line x1="50" y1="390" x2="250" y2="390" stroke="#722ed1" stroke-width="2"/>
  <text x="60" y="410" font-family="Arial" font-size="12" font-weight="bold">PK: id</text>
  <text x="60" y="430" font-family="Arial" font-size="12">area_code</text>
  <text x="60" y="450" font-family="Arial" font-size="12">shelf_no</text>

  <!-- Relationships -->
  <line x1="250" y1="170" x2="400" y2="170" stroke="#8c8c8c" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="325" y="160" font-family="Arial" font-size="11" text-anchor="middle">Related by part_id</text>
  
  <line x1="150" y1="240" x2="150" y2="350" stroke="#8c8c8c" stroke-width="1.5"/>
  <text x="160" y="300" font-family="Arial" font-size="12">N : 1</text>

</svg>