<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <rect x="10" y="10" width="580" height="380" fill="#f9f9f9" stroke="#333" stroke-width="2"/>
  <text x="300" y="40" font-family="Arial" font-size="18" font-weight="bold" text-anchor="middle">ER图 - 供应商与采购 (Supplier &amp; Procurement)</text>
  
  <!-- Supplier Entity -->
  <rect x="50" y="100" width="120" height="80" fill="#e7f3ff" stroke="#0056b3" stroke-width="2"/>
  <text x="110" y="145" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">供应商</text>
  
  <!-- Procurement Entity -->
  <rect x="430" y="100" width="120" height="80" fill="#e7f3ff" stroke="#0056b3" stroke-width="2"/>
  <text x="490" y="145" font-family="Arial" font-size="14" font-weight="bold" text-anchor="middle">采购单</text>
  
  <!-- Relationship -->
  <polygon points="300,100 340,140 300,180 260,140" fill="#fff" stroke="#333" stroke-width="1"/>
  <text x="300" y="145" font-family="Arial" font-size="12" text-anchor="middle">供应</text>
  
  <line x1="170" y1="140" x2="260" y2="140" stroke="#333" stroke-width="1"/>
  <line x1="340" y1="140" x2="430" y2="140" stroke="#333" stroke-width="1"/>
  
  <text x="180" y="135" font-family="Arial" font-size="12">1</text>
  <text x="410" y="135" font-family="Arial" font-size="12">N</text>
</svg>