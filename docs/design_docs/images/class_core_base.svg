<svg width="1000" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="500" y="30" font-family="Arial" font-size="20" text-anchor="middle" font-weight="bold" fill="#333">核心基类与模式类图 (Class Diagram: Core Base &amp; Patterns)</text>

  <!-- Base Class -->
  <rect x="50" y="80" width="250" height="180" fill="#f5f5f5" stroke="#8c8c8c" stroke-width="2"/>
  <path d="M 50 110 L 300 110" stroke="#8c8c8c" stroke-width="2"/>
  <text x="175" y="102" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">BaseModel (抽象基类)</text>
  <text x="60" y="130" font-family="Arial" font-size="11">- id: Integer {PK}</text>
  <text x="60" y="145" font-family="Arial" font-size="11">- created_at: DateTime</text>
  <text x="60" y="160" font-family="Arial" font-size="11">- updated_at: DateTime</text>
  <path d="M 50 180 L 300 180" stroke="#8c8c8c" stroke-width="1"/>
  <text x="60" y="200" font-family="Arial" font-size="11">+ to_dict(): dict</text>
  <text x="60" y="215" font-family="Arial" font-size="11">+ from_dict(data): void</text>

  <!-- Service Pattern -->
  <rect x="450" y="80" width="280" height="200" fill="#fff0f6" stroke="#eb2f96" stroke-width="2"/>
  <path d="M 450 110 L 730 110" stroke="#eb2f96" stroke-width="2"/>
  <text x="590" y="102" font-family="Arial" font-size="16" text-anchor="middle" font-weight="bold">BaseService (服务基类)</text>
  <text x="460" y="130" font-family="Arial" font-size="11">- db: Session</text>
  <text x="460" y="145" font-family="Arial" font-size="11">- model: Type[BaseModel]</text>
  <path d="M 450 160 L 730 160" stroke="#eb2f96" stroke-width="1"/>
  <text x="460" y="180" font-family="Arial" font-size="11">+ get_by_id(id): BaseModel</text>
  <text x="460" y="195" font-family="Arial" font-size="11">+ create(obj_in): BaseModel</text>
  <text x="460" y="210" font-family="Arial" font-size="11">+ update(db_obj, obj_in): BaseModel</text>
  <text x="460" y="225" font-family="Arial" font-size="11">+ remove(id): BaseModel</text>

  <!-- Inheritance -->
  <path d="M 175 260 L 175 350 L 450 350" fill="none" stroke="#8c8c8c" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="340" font-family="Arial" font-size="11" text-anchor="middle">Uses</text>

  <!-- Arrow Marker -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8c8c8c" />
    </marker>
  </defs>
</svg>