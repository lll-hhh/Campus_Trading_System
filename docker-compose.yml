services:
  # ========================================
  # MySQL (主数据库)
  # ========================================
  mysql:
    image: docker.m.daocloud.io/library/mysql:8.0
    container_name: campuswap-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-campuswap_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-campuswap}
      MYSQL_USER: ${MYSQL_USER:-campuswap}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-campuswap123}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/sql/init/mysql:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-campuswap_root}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - campuswap-network
    restart: unless-stopped

  # ========================================
  # Redis (缓存与消息队列)
  # ========================================
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
    container_name: campuswap-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - campuswap-network
    restart: unless-stopped

  # ========================================
  # API Gateway
  # ========================================
  gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campuswap-gateway
    environment:
      - MYSQL_DSN=mysql+pymysql://root:campuswap_root@mysql:3306/campuswap
      - REDIS_URL=redis://redis:6379/0
      - GLM_API_KEY=${GLM_API_KEY:-}
      - GLM_MODEL=${GLM_MODEL:-glm-4-flash}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/static:/app/static
      - gateway_data:/app/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - campuswap-network
    restart: unless-stopped

  # ========================================
  # Frontend
  # ========================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campuswap-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_PROXY_TARGET=http://gateway:8000
      - VITE_IMAGE_PROXY_TARGET=http://gateway:8000
    networks:
      - campuswap-network
    restart: unless-stopped

networks:
  campuswap-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  gateway_data: